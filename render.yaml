services:
  - type: web
    name: viggy-mart
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DELIVERY_INVITE_CODE
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://viggy-mart.onrender.com
